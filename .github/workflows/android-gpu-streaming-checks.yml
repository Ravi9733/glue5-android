name: Android GPU streaming checks

on:
  push:
    branches: [ai-performance-engine-foundation]
    paths:
      - "crates/glue5-gpu/**"
      - "crates/glue5-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-gpu-streaming-checks.yml"
  pull_request:
    paths:
      - "crates/glue5-gpu/**"
      - "crates/glue5-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: android-gpu-streaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Prepare patched Rust third-party sources
        run: bash .mise/tasks/setup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting of AI and integration files
        run: >-
          rustfmt --edition 2024 --check --config skip_children=true
          crates/glue5-gpu/src/adaptive.rs
          crates/glue5-gpu/src/perf.rs
          crates/glue5-runtime/src/lib.rs
          crates/glue5-stream/src/client.rs
      - name: Test runtime ring and memory accounting
        run: cargo test -p glue5-runtime
      - name: Test GPU decode budget and streaming
        run: cargo test -p glue5-gpu

  android-adreno-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Prepare patched Rust third-party sources
        run: bash .mise/tasks/setup
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;29.0.14206865'
      - uses: Swatinem/rust-cache@v2
      - name: Configure Android NDK compiler
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
      - name: Type-check GPU renderer for Android Adreno
        run: cargo check -p glue5-gpu --target aarch64-linux-android
