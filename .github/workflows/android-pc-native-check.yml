name: Android PC native backend checks

on:
  workflow_dispatch:
  push:
    branches: [android-pc-runtime-foundation]
    paths:
      - "crates/glue5-pc-native/**"
      - "crates/glue5-gpu/**"
      - "platform/android/java/local/glue5/Glue5Activity.java"
      - "docs/ANDROID_PC_NATIVE_BACKEND.md"
      - ".github/scripts/check-android-activity.sh"
      - ".github/workflows/android-pc-native-check.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  android-activity-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile Android activity against minimal API stubs
        run: bash .github/scripts/check-android-activity.sh

  pc-native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake
      - name: Prepare workspace-patched dependencies
        run: mise run setup
      - name: Test native PC archive parser, assets and placement pipeline
        run: cargo test -p glue5-pc-native

  vulkan-turnip-diagnostics-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake
      - name: Prepare workspace-patched dependencies
        run: mise run setup
      - name: Test Vulkan renderer and Turnip diagnostics
        run: cargo test -p glue5-gpu

  combined-runtime-compile-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake
      - name: Prepare workspace-patched dependencies
        run: mise run setup
      - name: Compile PC backend and Vulkan renderer together
        run: cargo check -p glue5-pc-native -p glue5-gpu
