name: Android PC native backend checks

on:
  workflow_dispatch:
  push:
    branches: [android-pc-runtime-foundation]
    paths:
      - "crates/glue5-pc-native/**"
      - "docs/ANDROID_PC_NATIVE_BACKEND.md"
      - ".github/workflows/android-pc-native-check.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  manifest-and-gate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake
      - name: Prepare workspace-patched dependencies
        run: mise run setup
      - name: Test native PC backend foundation
        run: cargo test -p glue5-pc-native
