name: Build RealityV Graphics ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - realityv-graphics-zip
    paths:
      - 'mods/RealityV_Graphics/**'
      - '.github/workflows/realityv-zip.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package mod ZIP
        run: |
          cd mods
          zip -r ../RealityV_Graphics_Glue5_Android.zip RealityV_Graphics
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealityV_Graphics_Glue5_Android
          path: RealityV_Graphics_Glue5_Android.zip
          if-no-files-found: error
