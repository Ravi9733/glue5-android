name: Auto RPF Converter Android

on:
  push:
    paths:
      - "tools/auto-rpf-converter/**"
      - ".github/workflows/auto-rpf-converter-android.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/auto-rpf-converter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools'
          "$SDKMANAGER" --install 'platforms;android-35'
          "$SDKMANAGER" --install 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gta-v-auto-rpf-converter-debug
          path: tools/auto-rpf-converter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
