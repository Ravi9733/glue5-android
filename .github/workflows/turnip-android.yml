# Build the Turnip-enabled Android APK from the integration branch.
name: Turnip Android integration build

on:
  workflow_dispatch:
  push:
    branches: [turnip-driver-integration]

permissions:
  contents: write

concurrency:
  group: turnip-android-integration-v6
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - uses: actions/checkout@v5

      - name: Fetch game.wasm from the draft release
        id: game
        run: |
          game=$RUNNER_TEMP/game
          .github/scripts/draft.sh fetch "$game"
          echo "GLUE5_GAME_DIR=$game" >>"$GITHUB_ENV"

      - name: Check runner disk space
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake java gradle android-sdk cargo:cargo-ndk
          cache_key_prefix: mise-turnip-android

      - name: Android signing key
        run: |
          yes | timeout --kill-after=5s 90s mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          cd ~/.android
          "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get "${{ steps.game.outputs.release }}" Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Turnip-enabled APK
        run: |
          mise run android:build
          cp target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android-turnip-test.apk
          cp ~/.android/debug.keystore Glue5-android.keystore

      - name: Upload APK to draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-android-turnip-test.apk Glue5-android.keystore
          echo "Turnip integration APK built; select Turnip only after importing a compatible driver ZIP." >>"$GITHUB_STEP_SUMMARY"
