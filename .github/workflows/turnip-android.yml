# Build the Turnip-enabled Android APK from the integration branch.
name: Turnip Android integration build

on:
  workflow_dispatch:
  push:
    branches:
      - turnip-driver-integration
      - ios-graphics-oiv-zip-installer
    paths-ignore:
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  # Queue builds instead of terminating an in-progress native compilation.
  group: glue5-android-release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # Native compilation takes longer than mise's common five-minute task limit.
      MISE_TASK_TIMEOUT: "45m"
      # Keep native compilation below the hosted runner memory ceiling.
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      GRADLE_OPTS: "-Dorg.gradle.workers.max=1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      # Preserve Cargo build artifacts between runner restarts so a
      # transient hosted-runner shutdown does not force a full cold compile.
      - name: Cache Rust and native build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Fetch game.wasm from the draft release
        id: game
        run: |
          game=$RUNNER_TEMP/game
          .github/scripts/draft.sh fetch "$game"
          echo "GLUE5_GAME_DIR=$game" >>"$GITHUB_ENV"

      - name: Check runner disk space
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake java gradle cargo:cargo-ndk
          cache_key_prefix: mise-turnip-android

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Android signing key
        run: |
          mkdir -p ~/.android
          cd ~/.android
          "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get "${{ steps.game.outputs.release }}" Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Diagnose runner resources
        run: |
          free -h
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          sed -n "1,12p" /proc/meminfo
          ulimit -a

      - name: Build Turnip-enabled APK
        run: |
          mise run --timeout 45m android:build
          cp target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android-turnip-test.apk
          cp ~/.android/debug.keystore Glue5-android.keystore

      - name: Package the JSON Placement Test Mod
        run: |
          mkdir -p /tmp/json-placement-test/road-construction
          cp mods/road-construction/main.luau /tmp/json-placement-test/road-construction/main.luau
          cp mods/road-construction/mod.json /tmp/json-placement-test/road-construction/mod.json
          cp mods/road-construction/road_construction.json /tmp/json-placement-test/road-construction/road_construction.json
          cp mods/road-construction/README.txt /tmp/json-placement-test/road-construction/README.txt
          (cd /tmp/json-placement-test && zip -r "$GITHUB_WORKSPACE/Glue5-JSON-Placement-Test.zip" road-construction)
          echo "Packaged JSON placement test mod." >>"$GITHUB_STEP_SUMMARY"

      - name: Upload APK and JSON mod ZIP to draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-android-turnip-test.apk Glue5-android.keystore Glue5-JSON-Placement-Test.zip
          echo "Turnip APK and JSON placement test ZIP uploaded to the draft release." >>"$GITHUB_STEP_SUMMARY"
