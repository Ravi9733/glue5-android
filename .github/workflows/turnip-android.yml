# Build the Turnip-enabled Android APK from the integration branch.
name: Turnip Android integration build

on:
  workflow_dispatch:
  push:
    branches:
      - turnip-driver-integration
      - ios-graphics-oiv-zip-installer
    paths-ignore:
      - .github/workflows/build.yml

permissions:
  contents: write
  actions: read

concurrency:
  # Queue builds instead of terminating an in-progress native compilation.
  group: glue5-android-release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # Keep long native compilation within the hosted runner's resource limits.
      MISE_TASK_TIMEOUT: "45m"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      # Keep Cargo serial, but use Rust's normal release codegen partitioning.
      # rpf-archive has a low-optimisation package override in Cargo.toml.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RAYON_NUM_THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      MAKEFLAGS: "-j1"
      GRADLE_OPTS: "-Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -XX:ActiveProcessorCount=2"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      # Reuse Cargo artifacts between runs to reduce repeated Rust compilation.
      - name: Cache Rust and native build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          add-job-id-key: false

      - name: Fetch game.wasm from the draft release
        id: game
        run: |
          game=$RUNNER_TEMP/game
          .github/scripts/draft.sh fetch "$game"
          echo "GLUE5_GAME_DIR=$game" >>"$GITHUB_ENV"

      - name: Check runner disk space
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake java gradle cargo:cargo-ndk
          cache_key_prefix: mise-turnip-android

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Download the verified Android ReShade FX layer
        run: |
          runs=$(gh run list --workflow build-reshade-runtime.yml --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId,status,conclusion,headSha)
          latest_id=$(echo "$runs" | jq -r '.[0].databaseId // empty')
          latest_status=$(echo "$runs" | jq -r '.[0].status // empty')
          latest_conclusion=$(echo "$runs" | jq -r '.[0].conclusion // empty')
          if [ "$latest_status" = "in_progress" ] || [ "$latest_status" = "queued" ]; then
            gh run watch "$latest_id" --exit-status
            run_id="$latest_id"
          elif [ "$latest_status" = "completed" ] && [ "$latest_conclusion" = "success" ]; then
            run_id="$latest_id"
          else
            run_id=$(echo "$runs" | jq -r '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' | head -n 1)
          fi
          test -n "$run_id" || { echo "No successful ARM64 ReShade runtime build exists yet"; exit 1; }
          mkdir -p "$RUNNER_TEMP/reshade-layer"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name glue5-reshade-fx-arm64 --dir "$RUNNER_TEMP/reshade-layer"
          test -s "$RUNNER_TEMP/reshade-layer/libVkLayer_VKBASALT_post_processing.so"
          mkdir -p target/android/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/reshade-layer/libVkLayer_VKBASALT_post_processing.so" target/android/jniLibs/arm64-v8a/
          file target/android/jniLibs/arm64-v8a/libVkLayer_VKBASALT_post_processing.so

      - name: Android signing key
        run: |
          mkdir -p ~/.android
          cd ~/.android
          "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get "${{ steps.game.outputs.release }}" Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Diagnose runner resource limits
        run: |
          free -h
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          printf '\n--- cgroup limits ---\n'
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events /sys/fs/cgroup/cpu.max; do
            if [ -r "$f" ]; then echo "--- $f"; cat "$f"; fi
          done
          printf '\n--- CPU ---\n'
          nproc
          lscpu | sed -n '1,18p'
          ulimit -a

      - name: Build Turnip-enabled APK
        run: |
          set -o pipefail
          echo "Build parallelism: Cargo=$CARGO_BUILD_JOBS, codegen=$CARGO_PROFILE_RELEASE_CODEGEN_UNITS, CMake=$CMAKE_BUILD_PARALLEL_LEVEL, Gradle workers=1"
          (
            while sleep 30; do
              echo "--- resource sample $(date -u +%FT%TZ) ---"
              awk '/MemAvailable|MemTotal/ {print}' /proc/meminfo
              for f in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
                if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
              done
              ps -eo pid,comm,%cpu,%mem --sort=-%cpu | head -n 8
            done
          ) &
          monitor_pid=$!
          trap 'echo "--- build interrupted; final cgroup state ---"; cat /sys/fs/cgroup/memory.events 2>/dev/null || true; kill "$monitor_pid" 2>/dev/null || true' EXIT
          mise run --timeout 45m android:build
          kill "$monitor_pid" 2>/dev/null || true
          trap - EXIT
          cp target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android-turnip-test.apk
          # Fail the build if Gradle did not package the actual ARM64 Vulkan layer.
          unzip -l Glue5-android-turnip-test.apk | grep -F 'lib/arm64-v8a/libVkLayer_VKBASALT_post_processing.so'
          unzip -l Glue5-android-turnip-test.apk | grep -F 'lib/arm64-v8a/libglue5.so'
          cp ~/.android/debug.keystore Glue5-android.keystore

      - name: Package the JSON Placement Test Mod
        run: |
          mkdir -p /tmp/json-placement-test/road-construction
          cp mods/road-construction/main.luau /tmp/json-placement-test/road-construction/main.luau
          cp mods/road-construction/mod.json /tmp/json-placement-test/road-construction/mod.json
          cp mods/road-construction/road_construction.json /tmp/json-placement-test/road-construction/road_construction.json
          cp mods/road-construction/README.txt /tmp/json-placement-test/road-construction/README.txt
          (cd /tmp/json-placement-test && zip -r "$GITHUB_WORKSPACE/Glue5-JSON-Placement-Test.zip" road-construction)
          echo "Packaged JSON placement test mod." >>"$GITHUB_STEP_SUMMARY"

      - name: Upload APK and JSON mod ZIP to draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-android-turnip-test.apk Glue5-android.keystore Glue5-JSON-Placement-Test.zip
          echo "Turnip APK and JSON placement test ZIP uploaded to the draft release." >>"$GITHUB_STEP_SUMMARY"
