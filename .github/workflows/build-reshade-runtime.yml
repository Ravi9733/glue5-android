name: Build Android ReShade FX runtime

on:
  workflow_dispatch:
  push:
    branches:
      - turnip-driver-integration
    paths:
      - "patches/vkbasalt/**"
      - ".github/workflows/build-reshade-runtime.yml"

permissions:
  contents: read

jobs:
  build-vkbasalt:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NDK_PKG: "ndk;27.2.12479018"
      NDK_VER: "27.2.12479018"
      VULKAN_HEADERS_TAG: "vulkan-sdk-1.4.309.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "$NDK_PKG"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip glslang-tools
          sudo pip3 install "meson>=1.1"

      - name: Fetch pinned Vulkan headers
        run: |
          git clone --depth 1 --branch "$VULKAN_HEADERS_TAG" https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          git clone --depth 1 --branch "$VULKAN_HEADERS_TAG" https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
          test -f "$RUNNER_TEMP/Vulkan-Headers/include/vulkan/vk_layer.h"
          test -f "$RUNNER_TEMP/SPIRV-Headers/include/spirv/unified1/spirv.hpp"

      - name: Fetch vkBasalt source and apply Android/ReShade patch
        run: |
          git clone https://github.com/DadSchoorse/vkBasalt.git third_party/vkbasalt
          git -C third_party/vkbasalt checkout 4f97f09
          git -C third_party/vkbasalt apply --check "$GITHUB_WORKSPACE/patches/vkbasalt/vkbasalt-android-livereload.patch"
          git -C third_party/vkbasalt apply "$GITHUB_WORKSPACE/patches/vkbasalt/vkbasalt-android-livereload.patch"
          git -C third_party/vkbasalt apply --check "$GITHUB_WORKSPACE/patches/vkbasalt/0002-android-loader-entrypoints.patch"
          git -C third_party/vkbasalt apply "$GITHUB_WORKSPACE/patches/vkbasalt/0002-android-loader-entrypoints.patch"

      - name: Configure Android arm64 build
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sed "s#__NDK_BIN__#$NDK_BIN#g" patches/vkbasalt/android-arm64.cross > "$RUNNER_TEMP/android-arm64.cross"
          meson setup build/vkbasalt third_party/vkbasalt \
            --cross-file "$RUNNER_TEMP/android-arm64.cross" \
            --buildtype release \
            -Dwith_json=true \
            -Dc_args="-I$RUNNER_TEMP/Vulkan-Headers/include -I$RUNNER_TEMP/SPIRV-Headers/include" \
            -Dcpp_args="-I$RUNNER_TEMP/Vulkan-Headers/include -I$RUNNER_TEMP/SPIRV-Headers/include"

      - name: Compile vkBasalt
        run: ninja -C build/vkbasalt -v

      - name: Verify ARM64 shared library and stage
        run: |
          mkdir -p out/reshade
          SO=$(find build/vkbasalt -name 'libvkbasalt.so' -type f | head -1)
          JSON=$(find build/vkbasalt -name 'vkBasalt.json' -type f | head -1)
          test -n "$SO"
          test -n "$JSON"
          # Android's production loader discovers packaged layer libraries by
          # the libVkLayer_*.so filename convention; it does not read vkBasalt.json.
          cp "$SO" out/reshade/libVkLayer_VKBASALT_post_processing.so
          cp "$JSON" out/reshade/vkBasalt.json
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h out/reshade/libVkLayer_VKBASALT_post_processing.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D out/reshade/libVkLayer_VKBASALT_post_processing.so | grep -E 'vkEnumerateInstanceLayerProperties|vkEnumerateInstanceExtensionProperties|vkGetInstanceProcAddr|vkGetDeviceProcAddr'
          file out/reshade/libVkLayer_VKBASALT_post_processing.so
          cat out/reshade/vkBasalt.json

      - uses: actions/upload-artifact@v4
        with:
          name: glue5-reshade-fx-arm64
          path: out/reshade/
          if-no-files-found: error
