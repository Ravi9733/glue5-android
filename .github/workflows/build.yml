# Builds the app for one platform from the game.wasm in a draft release.
# Android settings UI compile fixes are included on this branch.
name: Build

on:
  # Build the Turnip branch after code fixes so the APK can be validated.
  push:
    branches: [turnip-driver-integration, android-ios-port]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [ios, android, windows, macos, linux-x86_64, linux-aarch64]
        default: android

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.platform || 'android' }}

jobs:
  build:
    name: ${{ inputs.platform || 'android' }}
    runs-on: ${{ fromJSON('{"ios":"macos-26","macos":"macos-26","android":"ubuntu-24.04","linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm","windows":"windows-2025"}')[inputs.platform || 'android'] }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ inputs.platform || 'android' }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - uses: actions/checkout@v5

      - name: game.wasm from the draft release
        id: game
        run: |
          game=$RUNNER_TEMP/game
          if [ "$RUNNER_OS" = Windows ]; then game=$(cygpath -m "$game"); fi
          .github/scripts/draft.sh fetch "$game"
          echo "GLUE5_GAME_DIR=$game" >>"$GITHUB_ENV"

      - name: Git's bash for mise
        if: runner.os == 'Windows'
        run: echo "MISE_BASH_PATH=$(cygpath -w /)bin\\bash.exe" >>"$GITHUB_ENV"

      - name: Room on the disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: ${{ !startsWith(inputs.platform, 'linux') }}
          install_args: ${{ fromJSON('{"ios":"rust cmake xcodegen","macos":"rust cmake cargo:cargo-packager","android":"rust cmake java gradle android-sdk cargo:cargo-ndk","windows":"rust cmake"}')[inputs.platform || 'android'] }}
          cache_key_prefix: mise-${{ inputs.platform }}

      - name: Use mise-managed Android SDK
        if: env.PLATFORM == 'android'
        run: |
          sdk_root="$(mise where android-sdk)"
          echo "ANDROID_HOME=$sdk_root" >>"$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >>"$GITHUB_ENV"

      - name: Android signing key
        if: env.PLATFORM == 'android'
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager)"
          # sdkmanager closes the pipe after the final prompt; keep its
          # exit status (the last command), not yes's expected SIGPIPE.
          set +o pipefail
          yes | "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          mkdir -p ~/.android
          cd ~/.android
          "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get "${{ steps.game.outputs.release }}" Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build
        run: |
          case $PLATFORM in
          ios)
              mise run ios:ipa
              mv target/ios/Glue5.ipa Glue5-ios.ipa
              ;;
          windows)
              mise run build
              mv target/release/glue5.exe Glue5-windows.exe
              ;;
          macos)
              mise run macos:package
              mv target/package/*.dmg Glue5-macos.dmg
              ;;
          android)
              mise run android:build
              mv target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android.apk
              cp ~/.android/debug.keystore Glue5-android.keystore
              ;;
          linux-*)
              mise run linux:container "${PLATFORM#linux-}"
              mv target/package/*.AppImage "Glue5-$PLATFORM.AppImage"
              ;;
          esac

      - name: Verify Android Turnip runtime libraries in APK
        if: env.PLATFORM == 'android'
        run: |
          set -euo pipefail
          apk=Glue5-android.apk
          [ -s "$apk" ] || { echo "Android APK is missing or empty" >&2; exit 1; }
          entries=$(unzip -Z1 "$apk")
          for lib in libadrenotools.so libhook_impl.so libmain_hook.so libfile_redirect_hook.so libgsl_alloc_hook.so; do
            printf '%s\n' "$entries" | grep -Fx "lib/arm64-v8a/$lib" >/dev/null || {
              echo "Missing Turnip loader dependency in APK: $lib" >&2
              exit 1
            }
          done
          printf '%s\n' "$entries" | grep -Fx 'lib/arm64-v8a/libglue5.so' >/dev/null
          echo "Verified arm64 Glue 5 library and all AdrenoTools Turnip loader dependencies."

      - name: Package the Graphic Mods ZIP
        if: env.PLATFORM == 'android'
        run: |
          mkdir -p /tmp/graphic-mods/soft-blur-graphics
          cp mods/soft-blur-graphics/main.luau /tmp/graphic-mods/soft-blur-graphics/main.luau
          cp mods/soft-blur-graphics/mod.json /tmp/graphic-mods/soft-blur-graphics/mod.json
          cp mods/soft-blur-graphics/README.txt /tmp/graphic-mods/soft-blur-graphics/README.txt
          (cd /tmp/graphic-mods && zip -r "$GITHUB_WORKSPACE/Glue5-Graphic-Mods.zip" soft-blur-graphics)
          echo "Packaged loadable Soft Blur Graphics mod." >>"$GITHUB_STEP_SUMMARY"

      - name: Package the JSON Placement Test Mod
        if: env.PLATFORM == 'android'
        run: |
          mkdir -p /tmp/json-placement-test/road-construction
          cp mods/road-construction/main.luau /tmp/json-placement-test/road-construction/main.luau
          cp mods/road-construction/mod.json /tmp/json-placement-test/road-construction/mod.json
          cp mods/road-construction/road_construction.json /tmp/json-placement-test/road-construction/road_construction.json
          cp mods/road-construction/README.txt /tmp/json-placement-test/road-construction/README.txt
          (cd /tmp/json-placement-test && zip -r "$GITHUB_WORKSPACE/Glue5-JSON-Placement-Test.zip" road-construction)
          echo "Packaged JSON placement test mod." >>"$GITHUB_STEP_SUMMARY"

      - name: Into the draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-*
          echo "Built for $PLATFORM: the files are in the draft release. Keep it a draft." >>"$GITHUB_STEP_SUMMARY"
