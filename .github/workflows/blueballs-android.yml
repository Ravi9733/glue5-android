name: Blue Balls Android APK

on:
  push:
    branches:
      - blue-balls-glue5-port

permissions:
  contents: write

concurrency:
  group: blue-balls-android
  cancel-in-progress: false

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: android
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - uses: actions/checkout@v5

      - name: Get game.wasm from the draft release
        id: game
        run: |
          game=$RUNNER_TEMP/game
          .github/scripts/draft.sh fetch "$game"
          echo "GLUE5_GAME_DIR=$game" >>"$GITHUB_ENV"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake java gradle android-sdk cargo:cargo-ndk
          cache_key_prefix: mise-android

      - name: Android signing key
        run: |
          yes | mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          cd ~/.android
          "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get "${{ steps.game.outputs.release }}" Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
            mv Glue5-android.keystore debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: |
          mise run android:build
          mv target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android.apk
          cp ~/.android/debug.keystore Glue5-android.keystore

      - name: Upload APK to draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-*
          echo "Android APK built with the Blue Balls bundled mod. Keep the release as a draft." >>"$GITHUB_STEP_SUMMARY"
