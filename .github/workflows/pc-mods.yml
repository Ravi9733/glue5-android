name: PC mod loader checks

on:
  push:
    branches: [feature/pc-mod-loader]
    paths:
      - "crates/glue5-mods/**"
      - "crates/glue5-runtime/**"
      - "crates/glue5-stream/**"
      - "crates/glue5/src/ui/mods.rs"
      - "platform/android/**"
      - "crates/glue5-game/**"
      - "Cargo.toml"
      - ".mise/**"
      - ".github/workflows/pc-mods.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-mod-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: linux-x86_64
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the private game.wasm from the draft release
        id: game
        run: |
          mkdir -p "$RUNNER_TEMP/game"
          .github/scripts/draft.sh fetch "$RUNNER_TEMP/game"
          echo "GLUE5_GAME_DIR=$RUNNER_TEMP/game" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake
      - name: Prepare pinned third-party dependencies
        run: mise run setup
      - name: Inspect the exact game.wasm engine interface
        run: |
          cargo install wasm-tools --locked
          GAME_WASM="$(find "$GLUE5_GAME_DIR" -type f -name game.wasm -print -quit)"
          test -n "$GAME_WASM"
          wasm-tools dump "$GAME_WASM" > "$RUNNER_TEMP/game-wasm-sections.txt"
          wasm-tools print "$GAME_WASM" > "$RUNNER_TEMP/game-wasm.wat"
          grep -E '(\(import |\(export |\(func \$|\(memory |\(table )' "$RUNNER_TEMP/game-wasm.wat" > "$RUNNER_TEMP/game-wasm-symbol-index.txt" || true
      - name: Upload game.wasm interface report
        uses: actions/upload-artifact@v4
        with:
          name: glue5-game-wasm-interface
          path: |
            ${{ runner.temp }}/game-wasm-sections.txt
            ${{ runner.temp }}/game-wasm-symbol-index.txt
            ${{ runner.temp }}/game-wasm.wat
          retention-days: 3
      - name: Install SDL3 headless build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libdecor-0-dev
      - name: Compile PC mod loader and commit any lockfile update
        run: |
          set +e
          cargo check -p glue5 -p glue5-mods -p glue5-runtime -p glue5-stream
          check_status=$?
          set -e
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: update lockfile for PC mod archive parsers"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          exit "$check_status"
      - name: Test PC mod importer and DLC scanner
        run: cargo test --locked -p glue5 -p glue5-mods -p glue5-runtime -p glue5-stream
