name: Native UI source checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [native-android-engine-backend]

permissions:
  contents: read

jobs:
  rustfmt:
    name: Native UI module formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check newly extracted UI module
        run: rustfmt --check --edition 2024 crates/glue5/src/ui/kit.rs
