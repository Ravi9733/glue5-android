name: Native UI source checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [native-android-engine-backend]

permissions:
  contents: read

jobs:
  source-checks:
    name: Native shell source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check extracted UI module formatting
        run: rustfmt --check --edition 2024 crates/glue5/src/ui/kit.rs crates/glue5-ui-kit/src/lib.rs
      - name: Validate Cargo workspace metadata
        run: cargo metadata --no-deps --format-version 1 > /tmp/glue5-metadata.json
      - name: Ensure the shared UI kit stays engine-independent
        run: python3 scripts/check-native-ui-deps.py /tmp/glue5-metadata.json
