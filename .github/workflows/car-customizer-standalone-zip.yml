name: Package standalone Car Customizer
on:
  push:
    branches:
      - car-customizer-f7-standalone
    paths:
      - "mods/Car_Customizer/**"
      - ".github/workflows/car-customizer-standalone-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone mod
        run: |
          test -s mods/Car_Customizer/main.luau
          test -s mods/Car_Customizer/mod.json
          grep -q 'ui.menu("Car Customizer"' mods/Car_Customizer/main.luau
          grep -q 'menu:onOpen' mods/Car_Customizer/main.luau
          grep -q 'Primary paint' mods/Car_Customizer/main.luau
          grep -q 'Tyre-smoke colour' mods/Car_Customizer/main.luau
          grep -q 'Built-in livery / decals' mods/Car_Customizer/main.luau
          grep -q 'Upgrade everything' mods/Car_Customizer/main.luau
          ! grep -q 'require(' mods/Car_Customizer/main.luau
      - name: Package ZIP
        run: |
          mkdir -p dist
          cd mods/Car_Customizer
          zip -r ../../dist/Car-Customizer-F7-FIXED.zip main.luau mod.json
          cd ../..
          unzip -Z1 dist/Car-Customizer-F7-FIXED.zip | grep -qx main.luau
          unzip -Z1 dist/Car-Customizer-F7-FIXED.zip | grep -qx mod.json
          ! unzip -Z1 dist/Car-Customizer-F7-FIXED.zip | grep -q '^Car_Customizer/'
      - uses: actions/upload-artifact@v4
        with:
          name: Car-Customizer-F7-FIXED
          path: dist/Car-Customizer-F7-FIXED.zip
          if-no-files-found: error
          retention-days: 14
