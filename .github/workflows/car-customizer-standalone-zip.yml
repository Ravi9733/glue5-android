name: Package standalone Car Customizer
on:
  push:
    branches:
      - car-customizer-f7-standalone
    paths:
      - "mods/Car_Customizer/**"
      - ".github/workflows/car-customizer-standalone-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone mod and dependencies
        run: |
          test -s mods/Car_Customizer/main.luau
          test -s mods/Car_Customizer/mod.json
          test -s mods/Car_Customizer/features/customs.luau
          test -s mods/Car_Customizer/data/vehicles.luau
          grep -q 'ui.menu("Car Customizer"' mods/Car_Customizer/main.luau
          grep -q 'root:submenu("Customize Vehicle"' mods/Car_Customizer/features/customs.luau
          ! grep -q 'require("../core/bind")' mods/Car_Customizer/features/customs.luau
          ! grep -q 'require("../core/game")' mods/Car_Customizer/features/customs.luau
      - name: Package ZIP
        run: |
          mkdir -p dist
          cd mods/Car_Customizer
          zip -r ../../dist/Car-Customizer-F7-FIXED.zip main.luau mod.json features data
          cd ../..
          unzip -Z1 dist/Car-Customizer-F7-FIXED.zip | grep -qx main.luau
          unzip -Z1 dist/Car-Customizer-F7-FIXED.zip | grep -qx mod.json
          unzip -Z1 dist/Car-Customizer-F7-FIXED.zip | grep -qx features/customs.luau
          unzip -Z1 dist/Car-Customizer-F7-FIXED.zip | grep -qx data/vehicles.luau
          ! unzip -Z1 dist/Car-Customizer-F7-FIXED.zip | grep -q '^Car_Customizer/'
      - uses: actions/upload-artifact@v4
        with:
          name: Car-Customizer-F7-FIXED
          path: dist/Car-Customizer-F7-FIXED.zip
          if-no-files-found: error
          retention-days: 14
