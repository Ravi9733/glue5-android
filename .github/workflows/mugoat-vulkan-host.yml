name: Mugoat Android Vulkan host

on:
  workflow_dispatch:
  push:
    branches: [mugoat-android]
    paths:
      - "native-port/android/vulkan/**"
      - ".github/workflows/mugoat-vulkan-host.yml"

permissions:
  contents: read

jobs:
  compile-vulkan-host:
    name: Test ring protocol and compile ARM64 Vulkan host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test command ring bridge on host
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror \
            -Inative-port/android/vulkan \
            native-port/android/vulkan/CommandRingBridge.cpp \
            native-port/android/vulkan/tests/CommandRingBridgeTests.cpp \
            -o /tmp/mugoat-ring-tests
          /tmp/mugoat-ring-tests
      - name: Select preinstalled Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          NDK_PATH="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_PATH"
          cmake --version
      - name: Configure ARM64 Android build
        run: >-
          cmake -S native-port/android/vulkan
          -B build/mugoat-vulkan-arm64
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DCMAKE_BUILD_TYPE=Release
      - name: Compile Vulkan host
        run: cmake --build build/mugoat-vulkan-arm64 --parallel 2
