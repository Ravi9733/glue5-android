name: ScriptHook Android plugin sample

on:
  pull_request:
    paths:
      - "crates/glue5-scripthook/**"
      - ".github/workflows/scripthook-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-sample:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build native plugin sample
        working-directory: crates/glue5-scripthook/examples/native-plugin
        env:
          ANDROID_API_LEVEL: "29"
        run: ./build.sh

      - name: Upload sample plugin
        uses: actions/upload-artifact@v4
        with:
          name: glue5-scripthook-sample-arm64-v8a
          path: crates/glue5-scripthook/examples/native-plugin/build/arm64-v8a/sample.so
          if-no-files-found: error
