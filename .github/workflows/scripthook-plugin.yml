name: ScriptHook Android plugin sample

on:
  pull_request:
    paths:
      - "crates/glue5-scripthook/**"
      - ".github/workflows/scripthook-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-sample:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GitHub's Ubuntu runner image already provides the Android SDK.
      # Avoid setup-android@v3 here: its implicit legacy "tools" package
      # request is no longer published by Google's SDK repository.
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$SDK_ROOT" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build native plugin sample
        working-directory: crates/glue5-scripthook/examples/native-plugin
        env:
          ANDROID_API_LEVEL: "29"
        run: ./build.sh

      - name: Upload sample plugin
        uses: actions/upload-artifact@v4
        with:
          name: glue5-scripthook-sample-arm64-v8a
          path: crates/glue5-scripthook/examples/native-plugin/build/arm64-v8a/sample.so
          if-no-files-found: error
