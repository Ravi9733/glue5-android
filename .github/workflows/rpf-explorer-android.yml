name: RPF Explorer Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run RPF Explorer regression tests
        working-directory: rpf-explorer
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        working-directory: rpf-explorer
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-V-RPF-Explorer-debug
          path: rpf-explorer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
