name: RPF Explorer Tests (no APK)
on:
  workflow_dispatch:
  push:
    branches:
      - auto-rpf-converter-prototype
    paths:
      - "rpf-explorer/**"
      - ".github/workflows/rpf-explorer-tests.yml"
concurrency:
  group: rpf-explorer-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run RPF Explorer unit tests only
        working-directory: rpf-explorer
        run: gradle --no-daemon testDebugUnitTest
