plugins {
    id 'com.android.application'
}

android {
    namespace 'org.example.xbox360android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.example.xbox360android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-prototype'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}
